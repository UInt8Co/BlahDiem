name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Profile, proof and wire contracts
    runs-on: ubuntu-24.04
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift contracts
        run: swift test -j 4

  apple:
    name: Apple cryptography
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.0"
      - name: Test Swift contracts
        run: swiftly run swift test
