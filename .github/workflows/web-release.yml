name: WebAssembly library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Trust checkout for container build steps
        # checkout's safe.directory entry is in its temporary Git config.
        # The build also reads Git metadata from the runner-owned mount.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
      - name: Install Swift SDK for WebAssembly
        run: >-
          swift sdk install
          https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
          --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
      - name: Install pinned optimizer
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl
          curl --fail --location --retry 3 https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz -o /tmp/binaryen.tar.gz
          echo '2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  /tmp/binaryen.tar.gz' | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo '/tmp/binaryen-version_133/bin' >> "$GITHUB_PATH"
      - name: Install web build dependencies
        run: pnpm --dir Web install --frozen-lockfile
      - name: Compile BridgeJS and minimize release
        run: pnpm --dir Web build
      - name: Install browser
        run: pnpm --dir Web exec playwright install --with-deps chromium webkit
      - name: Verify minimized package in windows and workers
        run: pnpm --dir Web test
      - name: Package release
        shell: bash
        run: |
          cd Web/dist
          sha256sum -c SHA256SUMS
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf ../blahdiem-web.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: blahdiem-web
          path: |
            Web/dist/*
            Web/blahdiem-web.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blahdiem-web
          path: artifact
      - name: Publish tested JS, WASM, declarations and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Commit time keeps the tag stable when a run is retried on another day.
          commit_time=$(git show -s --format=%ct "$GITHUB_SHA")
          release_date=$(date -u -d "@$commit_time" +%Y%m%d)
          release_tag="$release_date-${GITHUB_SHA:0:4}"
          cat > /tmp/release-notes.md <<'NOTES'
          Prebuilt BlahDiem web library, generated with BridgeJS and minimized with Binaryen.
          Tested in Window, DedicatedWorker and SharedWorker. Download the archive or all
          matching JS/WASM/type files together; verify SHA256SUMS. See README.md for use,
          compression, custody boundaries and build details.
          NOTES
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --target "$GITHUB_SHA" --title "$release_tag" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$release_tag" artifact/dist/* artifact/blahdiem-web.tar.gz --clobber
